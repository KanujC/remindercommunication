[project]
name = "dunning-studio"
version = "0.1.0"
description = "Tone-adaptive payment-communication pipeline (synthetic-data reconstruction)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "langdetect>=1.0.9",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dunning = "dunning_studio.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dunning_studio = ["templates/static/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
